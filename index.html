<!DOCTYPE html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Информатика / бағдарламалау тесті</title>
    <style>
      :root {
        --bg: #fdf2f8;
        --white: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --pink: #db2777;
        --pink-dark: #be185d;
        --pink-light: #fce7f3;
        --pink-border: #f9a8d4;
        --timer: #fb923c;
        --green: #16a34a;
        --green-bg: #dcfce7;
        --red: #dc2626;
        --red-bg: #fee2e2;
        --radius: 14px;
        --shadow: 0 12px 40px rgba(219, 39, 119, 0.08);
        --font: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; font-family: var(--font); color: var(--text); background: var(--bg); }
      [hidden] { display: none !important; }
      .lang-switch {
        position: fixed; top: 16px; right: 20px; z-index: 100;
        display: flex; align-items: center; gap: 4px;
        background: var(--white); padding: 6px 12px; border-radius: 999px;
        border: 1px solid var(--pink-border); box-shadow: 0 2px 12px rgba(0,0,0,.06);
      }
      .lang-btn {
        border: none; background: transparent; font: inherit; font-weight: 700;
        cursor: pointer; color: var(--muted); padding: 4px 10px; border-radius: 999px;
      }
      .lang-btn.active { background: var(--pink-light); color: var(--pink-dark); }
      .lang-sep { color: var(--muted); }
      .screen { min-height: 100vh; display: none; }
      .screen.active { display: block; }

      /* Welcome */
      .screen-welcome { padding: 72px 20px 40px; }
      .welcome-shell {
        max-width: 980px; margin: 0 auto;
        background: var(--white); border-radius: var(--radius);
        box-shadow: var(--shadow); border: 1px solid #fce7f3;
        border-left: 5px solid var(--pink);
        display: grid; grid-template-columns: 1fr 1fr; overflow: hidden;
      }
      .welcome-left { padding: 36px 32px 40px; }
      .welcome-title { margin: 0 0 8px; font-size: clamp(1.4rem, 3vw, 1.85rem); color: var(--pink); font-weight: 800; line-height: 1.25; }
      .welcome-sub { margin: 0 0 24px; color: var(--muted); line-height: 1.5; font-size: 0.95rem; }
      .form-start { display: flex; flex-direction: column; gap: 16px; }
      .field { display: flex; flex-direction: column; gap: 6px; }
      .field-label { font-weight: 600; font-size: 0.9rem; }
      .field input, .field select {
        font: inherit; padding: 12px 14px; border-radius: 10px;
        border: 1px solid #e5e7eb; background: #fff; width: 100%;
      }
      .field input:focus, .field select:focus {
        outline: 2px solid rgba(219,39,119,.25); border-color: var(--pink);
      }
      .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .form-error { margin: 0; color: var(--red); font-size: 0.88rem; }
      .btn {
        font: inherit; font-weight: 700; cursor: pointer; border: none;
        border-radius: 10px; padding: 13px 22px; transition: .15s;
      }
      .btn-primary { background: var(--pink); color: #fff; }
      .btn-primary:hover { background: var(--pink-dark); }
      .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
      .btn-block { width: 100%; margin-top: 4px; }
      .btn-outline {
        background: #fff; color: var(--pink); border: 2px solid var(--pink);
      }
      .btn-outline:hover { background: var(--pink-light); }
      .btn-ghost { background: #fff; color: var(--pink); border: 2px solid var(--pink-border); }
      .btn-ghost:disabled { opacity: .45; cursor: not-allowed; }
      .btn-home {
        background: var(--pink); color: #fff; padding: 14px 32px;
        border-radius: 12px; font-size: 1rem;
      }
      .welcome-right {
        background: linear-gradient(145deg, #fce7f3 0%, #fbcfe8 50%, #f9a8d4 100%);
        display: flex; align-items: center; justify-content: center; padding: 24px; min-height: 320px;
      }
      .hero-art {
        width: 100%; max-width: 280px; aspect-ratio: 3/4; border-radius: 16px;
        background: linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,.1));
        border: 2px solid rgba(255,255,255,.5);
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; padding: 20px; color: var(--pink-dark);
      }
      .hero-art svg { width: 120px; height: 120px; margin-bottom: 12px; opacity: .9; }

      /* Quiz */
      .screen-quiz { padding: 64px 20px 32px; }
      .quiz-wrap { max-width: 900px; margin: 0 auto; }
      .quiz-header {
        display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
        gap: 12px; margin-bottom: 20px;
      }
      .student-block { display: flex; align-items: center; gap: 10px; }
      .avatar {
        width: 40px; height: 40px; border-radius: 50%;
        background: var(--pink-light); color: var(--pink);
        display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: .85rem;
      }
      .student-name { font-weight: 700; font-size: .95rem; }
      .student-meta { font-size: .8rem; color: var(--muted); }
      .hdr-spec-title {
        text-align: center; font-size: .82rem; font-weight: 600; color: var(--muted);
        line-height: 1.3; max-width: 220px; justify-self: center;
      }
      .timer-box {
        justify-self: end;
        background: #fff7ed; border: 1px solid #fed7aa;
        color: #c2410c; font-weight: 800; font-variant-numeric: tabular-nums;
        padding: 8px 14px; border-radius: 10px; font-size: .95rem;
      }
      .timer-box.warn { animation: pulse .9s ease-in-out infinite; }
      @keyframes pulse { 50% { filter: brightness(1.08); } }
      .btn-logout {
        justify-self: end; background: transparent; border: none;
        color: var(--muted); font: inherit; font-size: .85rem; cursor: pointer;
        display: inline-flex; align-items: center; gap: 6px;
      }
      .btn-logout:hover { color: var(--pink); }
      .progress-head {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 8px; font-weight: 700; color: var(--pink); font-size: .95rem;
      }
      .progress-track {
        height: 8px; background: #fce7f3; border-radius: 999px; overflow: hidden; margin-bottom: 20px;
      }
      .progress-fill {
        height: 100%; background: linear-gradient(90deg, var(--pink), #f472b6);
        border-radius: 999px; transition: width .25s ease; width: 5%;
      }
      .question-card {
        background: var(--white); border-radius: var(--radius); padding: 28px 24px;
        box-shadow: var(--shadow); border: 1px solid #fce7f3;
      }
      .question-text { margin: 0 0 20px; font-size: 1.1rem; line-height: 1.5; font-weight: 700; }
      .options { display: flex; flex-direction: column; gap: 10px; }
      .option {
        display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px;
        border: 1px solid #e5e7eb; border-radius: 10px; cursor: pointer; transition: .15s;
      }
      .option:hover { border-color: var(--pink-border); }
      .option.selected { border-color: var(--pink); background: var(--pink-light); box-shadow: 0 0 0 1px var(--pink); }
      .option input { margin-top: 3px; accent-color: var(--pink); }
      .option span { flex: 1; line-height: 1.45; }
      .quiz-nav { display: flex; justify-content: space-between; margin-top: 22px; gap: 12px; }

      /* Results */
      .screen-results { padding: 64px 20px 48px; }
      .results-wrap { max-width: 720px; margin: 0 auto; }
      .results-top {
        display: flex; justify-content: space-between; align-items: flex-start;
        margin-bottom: 20px; gap: 12px;
      }
      .summary-card {
        background: var(--white); border-radius: var(--radius); padding: 32px 28px;
        box-shadow: var(--shadow); border: 1px solid #fce7f3; text-align: center; margin-bottom: 24px;
      }
      .result-icon {
        width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 16px;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.75rem; font-weight: 800; color: #fff;
      }
      .result-icon.pass { background: var(--green); }
      .result-icon.fail { background: var(--red); }
      .results-title { margin: 0 0 8px; font-size: 1.35rem; font-weight: 800; }
      .results-sub { margin: 0 0 20px; color: var(--muted); line-height: 1.5; font-size: .92rem; }
      .score-line { font-size: 1.75rem; font-weight: 800; margin-bottom: 8px; }
      .score-line.fail { color: var(--red); }
      .score-line.pass { color: var(--green); }
      .ratio-line { color: var(--muted); font-weight: 600; }
      .review-title {
        display: flex; align-items: center; gap: 8px;
        font-weight: 700; margin-bottom: 14px; color: var(--red); font-size: .95rem;
      }
      .review-card {
        background: var(--white); border-radius: var(--radius); padding: 20px;
        border: 1px solid #fce7f3; margin-bottom: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.04);
      }
      .review-head {
        display: flex; justify-content: space-between; margin-bottom: 10px;
        font-size: .75rem; font-weight: 800; letter-spacing: .04em; color: var(--muted);
      }
      .review-q { margin: 0 0 14px; font-weight: 700; line-height: 1.45; }
      .ans-box {
        padding: 12px 14px; border-radius: 10px; margin-bottom: 8px; font-size: .9rem; line-height: 1.4;
      }
      .ans-wrong { background: var(--red-bg); border: 1px solid #fecaca; }
      .ans-correct { background: var(--green-bg); border: 1px solid #bbf7d0; }
      .ans-label { font-size: .7rem; font-weight: 800; letter-spacing: .03em; margin-bottom: 4px; display: block; }
      .ans-wrong .ans-label { color: var(--red); }
      .ans-correct .ans-label { color: var(--green); }
      .results-footer { text-align: center; margin-top: 28px; }
      .review-empty { color: var(--muted); text-align: center; padding: 20px; }

      @media (max-width: 768px) {
        .welcome-shell { grid-template-columns: 1fr; }
        .welcome-right { min-height: 200px; order: -1; }
        .quiz-header { grid-template-columns: 1fr; }
        .hdr-spec-title { text-align: left; max-width: none; }
        .timer-box, .btn-logout { justify-self: start; }
        .field-row { grid-template-columns: 1fr; }
        .quiz-nav { flex-direction: column-reverse; }
        .quiz-nav .btn { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="lang-switch" id="lang-switch" aria-label="Тіл">
      <button type="button" data-lang="kz" class="lang-btn active">KZ</button>
      <span class="lang-sep">/</span>
      <button type="button" data-lang="ru" class="lang-btn">RU</button>
    </div>

    <main class="screen screen-welcome active" id="screen-welcome">
      <div class="welcome-shell">
        <div class="welcome-left">
          <h1 class="welcome-title" data-i18n="welcomeTitle">Информатика / бағдарламалау тесті</h1>
          <p class="welcome-sub" data-i18n="welcomeSub">Университет студенттеріне арналған онлайн емтихан</p>
          <form id="form-start" class="form-start" novalidate>
            <label class="field">
              <span class="field-label" data-i18n="labelName">Толық аты-жөні</span>
              <input type="text" id="input-name" required placeholder="Ахметов Азамат" data-i18n-placeholder="phName" />
            </label>
            <div class="field-row">
              <label class="field">
                <span class="field-label" data-i18n="labelGroup">Топ</span>
                <select id="select-group" required><option value="" data-i18n="phGroup">Таңдаңыз...</option></select>
              </label>
              <label class="field">
                <span class="field-label" data-i18n="labelCourse">Курс</span>
                <select id="select-course" required><option value="" data-i18n="phCourse">Таңдаңыз...</option></select>
              </label>
            </div>
            <label class="field">
              <span class="field-label" data-i18n="labelSpec">Мамандық</span>
              <select id="select-spec" required><option value="" data-i18n="phSpec">Таңдаңыз...</option></select>
            </label>
            <p class="form-error" id="form-error" role="alert" hidden></p>
            <button type="submit" class="btn btn-primary btn-block" data-i18n="btnStart">Тестті бастау</button>
          </form>
        </div>
        <div class="welcome-right" aria-hidden="true">
          <div class="hero-art">
            <svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="60" cy="45" r="28" fill="#fbcfe8" stroke="#db2777" stroke-width="2"/>
              <rect x="35" y="78" width="50" height="30" rx="8" fill="#f9a8d4"/>
              <circle cx="50" cy="42" r="4" fill="#db2777"/><circle cx="70" cy="42" r="4" fill="#db2777"/>
              <path d="M48 52 Q60 60 72 52" stroke="#db2777" stroke-width="2" fill="none"/>
            </svg>
            <strong>IT Test</strong>
            <small style="margin-top:6px;opacity:.8">1–3 курс</small>
          </div>
        </div>
      </div>
    </main>

    <main class="screen screen-quiz" id="screen-quiz" hidden>
      <div class="quiz-wrap">
        <header class="quiz-header">
          <div class="student-block">
            <div class="avatar" id="avatar-initials">АА</div>
            <div>
              <div class="student-name" id="hdr-name"></div>
              <div class="student-meta" id="hdr-meta"></div>
            </div>
          </div>
          <div class="hdr-spec-title" id="hdr-spec"></div>
          <div class="timer-box" id="timer-box"><span id="timer-display">40:00</span></div>
        </header>
        <div class="progress-head">
          <span><span data-i18n="questionWord">Сұрақ</span> <span id="q-current">1</span> / <span id="q-total">20</span></span>
          <span id="progress-pct">5% аяқталды</span>
        </div>
        <div class="progress-track" role="progressbar"><div class="progress-fill" id="progress-fill"></div></div>
        <section class="question-card">
          <h2 class="question-text" id="question-text"></h2>
          <div class="options" id="options-root"></div>
        </section>
        <footer class="quiz-nav">
          <button type="button" class="btn btn-ghost" id="btn-back" data-i18n="btnBack">Артқа</button>
          <button type="button" class="btn btn-primary" id="btn-next" data-i18n="btnNext">Келесі</button>
        </footer>
      </div>
    </main>

    <main class="screen screen-results" id="screen-results" hidden>
      <div class="results-wrap">
        <div class="results-top">
          <div class="student-block">
            <div class="avatar" id="res-avatar">АА</div>
            <div>
              <div class="student-name" id="res-name"></div>
              <div class="student-meta" id="res-meta"></div>
            </div>
          </div>
          <button type="button" class="btn-logout" id="btn-logout" data-i18n="btnLogout">Жүйеден шығу</button>
        </div>
        <div class="summary-card">
          <div class="result-icon fail" id="result-icon">✕</div>
          <h2 class="results-title" id="result-title" data-i18n="resultFail">Тесттен өтпедіңіз</h2>
          <p class="results-sub" id="result-sub" data-i18n="resultFailSub">Келесі жолы сәттілік тілейміз. Қателермен жұмыс жасаңыз.</p>
          <p class="score-line fail" id="score-big">0 / 100</p>
          <p class="ratio-line" id="ratio-line">Дұрыс / Қате 0 / 20</p>
        </div>
        <h3 class="review-title" id="review-block-title" hidden>
          <span aria-hidden="true">ⓘ</span>
          <span data-i18n="reviewTitle">Қате берілген жауаптарды талдау</span>
        </h3>
        <div id="review-list"></div>
        <div class="results-footer">
          <button type="button" class="btn btn-home" id="btn-home" data-i18n="btnHome">Негізгі бетке оралу</button>
        </div>
      </div>
    </main>

    <script>
    (function () {

      function t(k) { return (i18n[lang] && i18n[lang][k]) || k; }
      function shuffle(a) {
        const x = a.slice();
        for (let i = x.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [x[i], x[j]] = [x[j], x[i]];
        }
        return x;
      }
      function initials(name) {
        const p = name.trim().split(/\s+/).filter(Boolean);
        if (!p.length) return "?";
        if (p.length === 1) return p[0].slice(0, 2).toUpperCase();
        return (p[0][0] + p[1][0]).toUpperCase();
      }
      function getQText(q) { return lang === "kz" ? q.text_kz : q.text_ru; }
      function getOpts(q) { return lang === "kz" ? q.options_kz : q.options_ru; }
      function labelCourse(v) {
        const c = COURSES.find((x) => x.v === v);
        return c ? (lang === "kz" ? c.kz : c.ru) : v;
      }
      function labelSpec(v) {
        const s = SPECIALTIES.find((x) => x.v === v);
        return s ? (lang === "kz" ? s.kz : s.ru) : v;
      }
      function metaLine() {
        return `${student.group} • ${labelCourse(student.course)}`;
      }

      function applyLang() {
        document.documentElement.lang = lang === "kz" ? "kk" : "ru";
        document.querySelectorAll("[data-i18n]").forEach((n) => {
          const k = n.getAttribute("data-i18n");
          if (k) n.textContent = t(k);
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach((n) => {
          const k = n.getAttribute("data-i18n-placeholder");
          if (k) n.placeholder = t(k);
        });
        fillSelects();
        document.querySelectorAll(".lang-btn").forEach((b) => {
          b.classList.toggle("active", b.getAttribute("data-lang") === lang);
        });
      }

      function fillSelects() {
        const gv = el.selectGroup.value, cv = el.selectCourse.value, sv = el.selectSpec.value;
        el.selectGroup.innerHTML = `<option value="">${t("phGroup")}</option>`;
        GROUPS.forEach((g) => {
          const o = document.createElement("option");
          o.value = g; o.textContent = g;
          el.selectGroup.appendChild(o);
        });
        el.selectCourse.innerHTML = `<option value="">${t("phCourse")}</option>`;
        COURSES.forEach((c) => {
          const o = document.createElement("option");
          o.value = c.v; o.textContent = lang === "kz" ? c.kz : c.ru;
          el.selectCourse.appendChild(o);
        });
        el.selectSpec.innerHTML = `<option value="">${t("phSpec")}</option>`;
        SPECIALTIES.forEach((s) => {
          const o = document.createElement("option");
          o.value = s.v; o.textContent = lang === "kz" ? s.kz : s.ru;
          el.selectSpec.appendChild(o);
        });
        if ([...el.selectGroup.options].some((o) => o.value === gv)) el.selectGroup.value = gv;
        if ([...el.selectCourse.options].some((o) => o.value === cv)) el.selectCourse.value = cv;
        if ([...el.selectSpec.options].some((o) => o.value === sv)) el.selectSpec.value = sv;
      }

      function showScreen(which) {
        [["welcome", el.screenWelcome], ["quiz", el.screenQuiz], ["results", el.screenResults]].forEach(([k, node]) => {
          const on = k === which;
          node.hidden = !on;
          node.classList.toggle("active", on);
        });
      }

      function formatTime(ms) {
        const s = Math.max(0, Math.floor(ms / 1000));
        return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
      }
      function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
      function startTimer() {
        stopTimer();
        deadline = Date.now() + QUIZ_MS;
        const tick = () => {
          const left = Math.max(0, deadline - Date.now());
          el.timerDisplay.textContent = formatTime(left);
          el.timerBox.classList.toggle("warn", left <= WARN_MS && left > 0);
          if (left === 0) finishQuiz();
        };
        tick();
        timerId = setInterval(tick, 1000);
      }

      function renderQuestion() {
        const q = sessionQuestions[currentIndex];
        const n = currentIndex + 1;
        el.qCurrent.textContent = n;
        el.qTotal.textContent = QUIZ_TOTAL;
        const pct = Math.round((n / QUIZ_TOTAL) * 100);
        el.progressFill.style.width = pct + "%";
        el.progressPct.textContent = pct + "% " + t("progressDone");
        el.questionText.textContent = getQText(q);
        el.optionsRoot.innerHTML = "";
        const opts = getOpts(q);
        const saved = answers[currentIndex];
        opts.forEach((text, idx) => {
          const lab = document.createElement("label");
          lab.className = "option" + (saved === idx ? " selected" : "");
          const inp = document.createElement("input");
          inp.type = "radio";
          inp.name = "answer";
          inp.checked = saved === idx;
          const span = document.createElement("span");
          span.textContent = text;
          lab.appendChild(inp);
          lab.appendChild(span);
          lab.addEventListener("click", () => {
            answers[currentIndex] = idx;
            el.optionsRoot.querySelectorAll(".option").forEach((o) => o.classList.remove("selected"));

            el.btnNext.disabled = false;

        el.btnNext.disabled = saved == null;

      function validateForm() {
        el.formError.hidden = true;
        if (!el.inputName.value.trim()) { el.formError.textContent = t("errName"); el.formError.hidden = false; return false; }
        if (!el.selectGroup.value) { el.formError.textContent = t("errGroup"); el.formError.hidden = false; return false; }
        if (!el.selectCourse.value) { el.formError.textContent = t("errCourse"); el.formError.hidden = false; return false; }
        if (!el.selectSpec.value) { el.formError.textContent = t("errSpec"); el.formError.hidden = false; return false; }

      function beginSession() {
        if (bank.length < QUIZ_TOTAL) {

        const ini = initials(student.name);
        el.resAvatar.textContent = ini;
        el.resName.textContent = student.name;
        el.resMeta.textContent = metaLine();

        el.resultIcon.textContent = passed ? "✓" : "✕";
        el.resultIcon.className = "result-icon " + (passed ? "pass" : "fail");

        el.resultSub.textContent = t(passed ? "resultPassSub" : "resultFailSub");

        el.ratioLine.textContent = t("ratio") + " " + correct + " / " + wrong;

        el.reviewList.innerHTML = "";

          el.reviewBlockTitle.hidden = false;
          wrongItems.forEach((item, idx) => {
            const card = document.createElement("article");
            card.className = "review-card";
            card.innerHTML =
              '<div class="review-head"><span>' + t("questionWord").toUpperCase() + " " + (idx + 1) + '</span><span>0 ' + t("points") + "</span></div>" +
              '<p class="review-q">' + escapeHtml(item.text) + "</p>" +
              '<div class="ans-box ans-wrong"><span class="ans-label">' + t("yourWrong") + "</span>" + escapeHtml(item.user) + "</div>" +
              '<div class="ans-box ans-correct"><span class="ans-label">' + t("correctAns") + "</span>" + escapeHtml(item.right) + "</div>";
            el.reviewList.appendChild(card);
          });
        } else {
          el.reviewBlockTitle.hidden = true;
          el.reviewList.innerHTML = '<p class="review-empty">' + t("reviewEmpty") + "</p>";
        }
        showScreen("results");
      }

      function escapeHtml(s) {
        const d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
      }

      function goHome() {
        el.formStart.reset();
        fillSelects();
        stopTimer();
        sessionEnded = false;
        showScreen("welcome");
      }

      el.formStart.addEventListener("submit", (e) => { e.preventDefault(); if (validateForm()) beginSession(); });
      el.btnBack.addEventListener("click", () => { if (currentIndex > 0) { currentIndex--; renderQuestion(); } });
      el.btnNext.addEventListener("click", () => {
        if (answers[currentIndex] == null) return;
        if (currentIndex < QUIZ_TOTAL - 1) { currentIndex++; renderQuestion(); }
        else finishQuiz();
      });
      el.btnHome.addEventListener("click", goHome);
      el.btnLogout.addEventListener("click", goHome);
      document.getElementById("lang-switch").addEventListener("click", (e) => {
        const btn = e.target.closest(".lang-btn");
        if (!btn) return;
        lang = btn.getAttribute("data-lang") === "ru" ? "ru" : "kz";
        try { localStorage.setItem("quiz_lang", lang); } catch (err) {}
        applyLang();
        if (!el.screenQuiz.hidden) {
          el.hdrMeta.textContent = metaLine();
          el.hdrSpec.textContent = labelSpec(student.spec);
          renderQuestion();
        }
        if (!el.screenResults.hidden) {
          sessionEnded = false;
          finishQuiz();
        }
      });

      applyLang();
      showScreen("welcome");
    })();
    </script>
  </body>
</html>
